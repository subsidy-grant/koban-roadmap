<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0057c2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="補助金ロードマップ">
<title>会社情報｜補助金活用 業務改善ロードマップ</title>
<meta name="description" content="登録した会社を選ぶと、プロフィール編集・現在の申請状況・メモにアクセスできます。法人と個人事業主を分けて経営しているなど、複数の会社をお持ちの場合は会社ごとに分けて登録できます。登録不要・処理はお使いの端末の中だけ。">
<link rel="canonical" href="https://subsidy-grant.github.io/koban-roadmap/profile.html">
<meta name="robots" content="index,follow">
<meta property="og:type" content="article">
<meta property="og:site_name" content="補助金活用 業務改善ロードマップ">
<meta property="og:title" content="会社情報｜複数会社にも対応">
<meta property="og:description" content="登録した会社を選ぶと、プロフィール編集・現在の申請状況・メモにアクセスできます。複数の会社をお持ちの場合は、会社ごとに分けて登録できます。">
<meta property="og:url" content="https://subsidy-grant.github.io/koban-roadmap/profile.html">
<meta property="og:locale" content="ja_JP">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* 配色・書体・トークンはdocuments.htmlと共通（design.md参照）。
     このページ独自の見せ方は「記入欄」と「会社の一覧・追加・切替」だけ。 */
  :root {
    --paper: #eaf1fb;
    --paper-raised: #ffffff;
    --ink: #0c2036;
    --ink-soft: #3a5170;
    --ink-faint: #4d6a8a;
    --accent: #0057c2;
    --accent-soft: #bcd7f7;
    --accent-wash: #e2edfb;
    --on-accent: #ffffff;
    --sage: #0d8a6e;
    --sage-wash: #dcf5ee;
    --rust: #d84315;
    --rust-wash: #fde3d6;
    --line: #a9c2e0;
    --shadow: rgba(12, 32, 54, 0.12);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --shadow-btn: 0 2px 4px var(--shadow);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #081422; --paper-raised: #16283d; --ink: #eaf1fb; --ink-soft: #b7cbe4;
      --ink-faint: #93abc9; --accent: #5b9df5; --accent-soft: #1c3454; --accent-wash: #142640;
      --on-accent: #0d1218; --sage: #3fd6ac; --sage-wash: #0f2b24; --rust: #ff8a5c;
      --rust-wash: #33200f; --line: #385578; --shadow: rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --paper: #081422; --paper-raised: #16283d; --ink: #eaf1fb; --ink-soft: #b7cbe4;
    --ink-faint: #93abc9; --accent: #5b9df5; --accent-soft: #1c3454; --accent-wash: #142640;
    --on-accent: #0d1218; --sage: #3fd6ac; --sage-wash: #0f2b24; --rust: #ff8a5c;
    --rust-wash: #33200f; --line: #385578; --shadow: rgba(0, 0, 0, 0.5);
  }
  :root[data-theme="light"] {
    --paper: #eaf1fb; --paper-raised: #ffffff; --ink: #0c2036; --ink-soft: #3a5170;
    --ink-faint: #4d6a8a; --accent: #0057c2; --accent-soft: #bcd7f7; --accent-wash: #e2edfb;
    --on-accent: #ffffff; --sage: #0d8a6e; --sage-wash: #dcf5ee; --rust: #d84315;
    --rust-wash: #fde3d6; --line: #a9c2e0; --shadow: rgba(12, 32, 54, 0.12);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); line-height: 1.8;
    font-family: "BIZ UDPGothic","BIZ UDGothic","Noto Sans JP","Yu Gothic Medium","Hiragino Sans","Meiryo",sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .jp-serif { font-family: "BIZ UDPMincho","BIZ UDMincho","Yu Mincho","Hiragino Mincho ProN",serif; }
  main { max-width: 940px; margin: 0 auto; padding: 2.5rem 1.1rem 1.5rem; }
  a { color: var(--accent); }

  /* ---- ページ頭 ---- */
  h1 { font-size: 1.5rem; margin: 0.4rem 0 0.6rem; line-height: 1.6; text-wrap: balance; }
  .lede { color: var(--ink-soft); font-size: 0.98rem; margin: 0 0 0.4rem; max-width: 62ch; }

  section { margin-top: 2rem; scroll-margin-top: 1rem; }
  .section-head { display: flex; align-items: baseline; gap: 0.7rem; border-bottom: 2px solid var(--accent);
    padding-bottom: 0.45rem; margin-bottom: 0.9rem; }
  .section-no { font-size: 1.5rem; color: var(--accent); font-variant-numeric: tabular-nums; }
  .section-head h2 { font-size: 1.15rem; margin: 0; }
  .section-sub { color: var(--ink-soft); font-size: 0.93rem; margin: 0 0 1rem; max-width: 66ch; }

  .btn {
    border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent);
    border-radius: var(--radius-md); padding: 0.6rem 1.1rem; font: inherit; font-size: 0.92rem;
    cursor: pointer; min-height: 44px; box-shadow: var(--shadow-btn);
  }
  .btn.ghost { background: var(--paper-raised); color: var(--accent); }
  .btn:hover { filter: brightness(1.08); }
  .btn[disabled], .btn[disabled]:hover {
    background: var(--paper); color: var(--ink-faint); border-color: var(--line);
    cursor: not-allowed; filter: none;
  }
  .saved-note { font-size: 0.86rem; color: var(--sage); margin: 0.7rem 0 0; min-height: 1.5em; }

  .pcard { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 1rem 1.1rem; margin-bottom: 0.9rem; box-shadow: 0 1px 3px var(--shadow), 0 1px 2px var(--shadow); }

  /* ---- 会社の一覧・追加・切替（このページ独自） ----
     会社が1社だけのとき（既定・移行直後を含む）は「切り替える」体験が要らないので、
     チップは1個だけ淡く出し、追加・名前変更だけを目立たせる。
     2社以上になったらチップ切替がはじめて意味を持つので、選択中のチップを強調する。 */
  .company-switcher { background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: var(--radius-lg); padding: 1rem 1.1rem; margin-bottom: 1.4rem; }
  .cs-ttl { font-size: 0.86rem; font-weight: 700; color: var(--ink-soft); margin: 0 0 0.6rem; }
  .cs-chips { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  .cs-chip { display: inline-flex; align-items: center; gap: 0.4rem;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft);
    border-radius: 999px; padding: 0.4rem 0.5rem 0.4rem 0.9rem; font-size: 0.9rem; }
  .cs-chip.is-current { border-color: var(--accent); background: var(--accent-wash); color: var(--accent); font-weight: 700; }
  .cs-chip button.cs-select { border: 0; background: transparent; color: inherit; font: inherit;
    font-size: 0.9rem; font-weight: inherit; cursor: pointer; padding: 0.15rem 0; min-height: 32px; }
  .cs-chip.is-current button.cs-select { cursor: default; }
  .cs-chip .cs-rename, .cs-chip .cs-remove { border: 0; background: transparent; color: var(--ink-faint);
    font: inherit; font-size: 0.78rem; cursor: pointer; padding: 0.2rem 0.4rem; min-height: 32px; text-decoration: underline; }
  .cs-chip.is-current .cs-rename, .cs-chip.is-current .cs-remove { color: var(--accent); }
  .cs-add { border: 1px dashed var(--accent-soft); background: transparent; color: var(--accent);
    font: inherit; font-size: 0.88rem; font-weight: 700; border-radius: 999px; padding: 0.45rem 1rem;
    cursor: pointer; min-height: 44px; }
  .cs-add:hover { background: var(--accent-wash); }
  .cs-hint { margin: 0.6rem 0 0; font-size: 0.82rem; color: var(--ink-faint); }
  .company-switcher.is-single .cs-chip .cs-remove { display: none; }

  /* ---- 会社を選んだあとのアクションカード（プロフィール編集／現在の申請状況） ---- */
  .cs-actions { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1.4rem; }
  .cs-action-card { flex: 1 1 15rem; display: flex; align-items: center; gap: 0.8rem;
    text-align: left; border: 1px solid var(--line); background: var(--paper-raised);
    border-radius: var(--radius-lg); padding: 1rem 1.1rem; font: inherit; color: var(--ink);
    cursor: pointer; min-height: 44px; box-shadow: var(--shadow-btn); }
  .cs-action-card.is-open { border-color: var(--accent); background: var(--accent-wash); }
  .cs-action-icon { font-size: 1.6rem; line-height: 1; flex: none; }
  .cs-action-body { display: flex; flex-direction: column; gap: 0.15rem; }
  .cs-action-lead { font-weight: 700; font-size: 0.98rem; }
  .cs-action-sub { font-size: 0.82rem; color: var(--ink-soft); }
  .cs-panel { border: 1px solid var(--line); background: var(--paper-raised);
    border-radius: var(--radius-lg); padding: 1.1rem 1.2rem; margin-bottom: 1.4rem; }
  .cs-status-row { display: flex; justify-content: space-between; align-items: center;
    gap: 0.6rem; padding: 0.7rem 0; border-bottom: 1px dashed var(--line); }
  .cs-status-row:last-child { border-bottom: 0; }
  .cs-status-name { font-weight: 700; font-size: 0.94rem; }
  .cs-status-meta { font-size: 0.82rem; color: var(--ink-soft); margin-top: 0.15rem; }
  .cs-status-pct { font-size: 0.92rem; font-weight: 700; color: var(--accent); flex: none; }
  .empty { color: var(--ink-soft); font-size: 0.93rem; }

  /* ---- 開閉ブロック（<details>）。documents.htmlと同じ意匠 ---- */
  .fold { border: 1px solid var(--line); border-radius: var(--radius-md);
    background: var(--paper-raised); padding: 0.2rem 1rem 1rem; margin: 1rem 0; }
  .fold > summary { list-style: none; cursor: pointer; padding: 0.85rem 0;
    font-weight: 700; font-size: 0.95rem; color: var(--ink); display: flex;
    align-items: center; gap: 0.5rem; min-height: 44px; margin: 0 -1rem; padding-left: 1rem; }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary::before { content: '▸'; color: var(--accent); flex: none; }
  .fold[open] > summary::before { content: '▾'; }
  .fold > summary:hover { background: var(--accent-wash); }
  .fold > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

</style>
</head>
<body>
<main>
  <h1>会社情報</h1>

  <section id="company">
    <div class="company-switcher" id="companySwitcher">
      <p class="cs-ttl" id="csTtl">登録されている会社</p>
      <div class="cs-chips" id="csChips"></div>
      <p class="cs-hint" id="csHint"></p>
    </div>

    <div class="cs-actions" id="csActions">
      <a href="profile_edit.html" class="cs-action-card" id="csEditBtn">
        <span class="cs-action-icon" aria-hidden="true">✏️</span>
        <span class="cs-action-body"><span class="cs-action-lead">プロフィール編集</span>
        <span class="cs-action-sub">選んだ会社の情報を入力・修正します</span></span>
      </a>
      <a href="profile_status.html" class="cs-action-card" id="csStatusBtn">
        <span class="cs-action-icon" aria-hidden="true">📋</span>
        <span class="cs-action-body"><span class="cs-action-lead">現在の申請状況</span>
        <span class="cs-action-sub" id="csStatusSub">申請の件数と進み具合を見ます</span></span>
      </a>
      <button type="button" class="cs-action-card" id="csMemoBtn">
        <span class="cs-action-icon" aria-hidden="true">📝</span>
        <span class="cs-action-body"><span class="cs-action-lead">メモ</span>
        <span class="cs-action-sub" id="csMemoSub">この会社についてのメモを残せます</span></span>
      </button>
    </div>

    <div id="companyMemo" class="cs-panel" style="display:none;">
      <label for="csMemoInput" style="display:block;font-size:0.86rem;font-weight:700;margin-bottom:0.4rem;">この会社についてのメモ</label>
      <textarea id="csMemoInput" rows="4" placeholder="例）登記事項証明書は既に手元にある／担当は税理士の○○さん　など、自由にお使いください" style="width:100%;font:inherit;font-size:0.95rem;padding:0.6rem;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper-raised);color:var(--ink);box-sizing:border-box;resize:vertical;"></textarea>
    </div>

    <p class="saved-note" id="savedNote"></p>
  </section>

  <section id="companyBackup" style="margin-top:0.8rem;">
    <details class="fold">
      <summary>会社情報の書き出し・読み込み</summary>
      <p class="lede" style="margin-top:0.8rem;">この端末に保存されている全ての会社情報をファイルに書き出せます。別の端末に移すときや、うっかり消してしまったときのバックアップに使えます。</p>
      <div class="cs-actions">
        <button type="button" class="cs-action-card" id="csExportBtn">
          <span class="cs-action-icon" aria-hidden="true">⬇️</span>
          <span class="cs-action-body"><span class="cs-action-lead">書き出す</span>
          <span class="cs-action-sub">全ての会社情報をファイルに保存します</span></span>
        </button>
        <button type="button" class="cs-action-card" id="csImportBtn">
          <span class="cs-action-icon" aria-hidden="true">⬆️</span>
          <span class="cs-action-body"><span class="cs-action-lead">読み込む</span>
          <span class="cs-action-sub">書き出したファイルから会社情報を戻します</span></span>
        </button>
        <input type="file" id="csImportFile" accept=".json" style="display:none;">
      </div>
      <p class="cs-hint" id="csBackupMsg"></p>
    </details>
  </section>
</main>

<script src="page_data.js"></script>
<script src="common_docs.js"></script>
<script src="company_data.js"></script>
<script>
(function () {
  'use strict';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // ---------- 会社情報 ----------
  // FIELDSの定義・id・件数は company_data.js の1か所だけに置く
  // （documents.htmlの自動転記エンジンも同じ定義を使うため、ここでは再定義しない）。
  var FIELDS = window.KOBAN_COMPANY.FIELDS;

  // 「現在選択中の会社」を指す。documents.htmlのように単一オブジェクトではなく、
  // company.id / company.label で「どの会社か」を持ち回す。
  var company = window.KOBAN_COMPANY.getCurrent() || { id: null };

  function saveCompany() {
    var ok = false;
    try { window.KOBAN_COMPANY.save(company); ok = true; } catch (e) { ok = false; }
    showSaved(ok);
    return ok;
  }
  var savedTimer = null;
  function showSaved(ok) {
    var n = document.getElementById('savedNote');
    if (!n) return;
    n.textContent = ok ? 'この端末に保存しました。' :
      '保存できませんでした（ブラウザの設定で保存が禁止されている可能性があります）。';
    n.style.color = ok ? 'var(--sage)' : 'var(--rust)';
    clearTimeout(savedTimer);
    savedTimer = setTimeout(function () { n.textContent = ''; }, 2500);
  }

  // ---------- 会社の一覧・追加・切替・削除 ----------
  function renderSwitcher() {
    var wrap = document.getElementById('companySwitcher');
    var chipsEl = document.getElementById('csChips');
    var hintEl = document.getElementById('csHint');
    var ttlEl = document.getElementById('csTtl');
    var list = window.KOBAN_COMPANY.list();
    var curId = company.id;
    var isSingle = list.length <= 1;
    wrap.classList.toggle('is-single', isSingle);
    ttlEl.textContent = isSingle ? '登録されている会社' : '登録されている会社（クリックで切り替え）';

    chipsEl.innerHTML = list.map(function (c) {
      var isCur = c.id === curId;
      return '<span class="cs-chip' + (isCur ? ' is-current' : '') + '" data-id="' + esc(c.id) + '">' +
        '<button type="button" class="cs-select"' + (isCur ? ' aria-current="true"' : '') + '>' +
          esc(window.KOBAN_COMPANY.displayLabel(c)) + '</button>' +
        (isSingle ? '' : '<button type="button" class="cs-remove">削除</button>') +
      '</span>';
    }).join('') + '<button type="button" class="cs-add" id="csAddBtn">＋ 会社を追加</button>';

    hintEl.textContent = isSingle
      ? '会社を法人と個人事業主で分けているなど、複数お持ちの場合は「＋ 会社を追加」で分けて登録できます。'
      : '選んだ会社が「プロフィール編集」の対象になります。書類準備ページでも、ここで選んだ会社の情報が使われます。';

    chipsEl.querySelectorAll('.cs-chip').forEach(function (chip) {
      var id = chip.getAttribute('data-id');
      var selectBtn = chip.querySelector('.cs-select');
      var renameBtn = chip.querySelector('.cs-rename');
      var removeBtn = chip.querySelector('.cs-remove');
      if (selectBtn) {
        selectBtn.addEventListener('click', function () {
          if (id === company.id) return;
          window.KOBAN_COMPANY.setCurrentId(id);
          company = window.KOBAN_COMPANY.get(id) || { id: id };
          renderSwitcher();
          refreshMemoIfOpen();
        });
      }
      if (removeBtn) {
        removeBtn.addEventListener('click', function () {
          var target = window.KOBAN_COMPANY.get(id);
          if (!target) return;
          var ok = confirm('「' + window.KOBAN_COMPANY.displayLabel(target) + '」を削除します。入力した会社情報も削除されます。よろしいですか？');
          if (!ok) return;
          window.KOBAN_COMPANY.remove(id);
          company = window.KOBAN_COMPANY.getCurrent() || { id: null };
          renderSwitcher();
          refreshMemoIfOpen();
        });
      }
    });

    var addBtn = document.getElementById('csAddBtn');
    if (addBtn) {
      addBtn.addEventListener('click', function () {
        var c = window.KOBAN_COMPANY.add();
        company = c;
        renderSwitcher();
        refreshMemoIfOpen();
      });
    }
  }
  function refreshMemoIfOpen() {
    refreshMemoSub();
    var memoBox = document.getElementById('companyMemo');
    var memoInput = document.getElementById('csMemoInput');
    if (memoBox && memoInput && memoBox.style.display !== 'none') memoInput.value = company.memo || '';
  }

  function refreshMemoSub() {
    var sub = document.getElementById('csMemoSub');
    if (sub) sub.textContent = company.memo ? company.memo.slice(0, 30) + (company.memo.length > 30 ? '…' : '') : 'この会社についてのメモを残せます';
  }
  document.getElementById('csMemoBtn').addEventListener('click', function () {
    var box = document.getElementById('companyMemo');
    var isOpen = box.style.display !== 'none';
    box.style.display = isOpen ? 'none' : '';
    this.classList.toggle('is-open', !isOpen);
    if (!isOpen) {
      document.getElementById('csMemoInput').value = company.memo || '';
      box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
  document.getElementById('csMemoInput').addEventListener('input', function () {
    company.memo = this.value;
    saveCompany();
    refreshMemoSub();
  });

  // ---------- 会社情報の書き出し・読み込み ----------
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  document.getElementById('csExportBtn').addEventListener('click', function () {
    var list = window.KOBAN_COMPANY.list();
    var json = JSON.stringify({ companies: list, exportedAt: 'koban-roadmap' }, null, 2);
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'koban-roadmap-会社情報.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    var msg = document.getElementById('csBackupMsg');
    if (msg) msg.textContent = 'ファイルに書き出しました。';
  });
  document.getElementById('csImportBtn').addEventListener('click', function () {
    document.getElementById('csImportFile').click();
  });
  document.getElementById('csImportFile').addEventListener('change', function () {
    var file = this.files && this.files[0];
    this.value = '';
    if (!file) return;
    var msg = document.getElementById('csBackupMsg');
    var reader = new FileReader();
    reader.onload = function () {
      var data;
      try { data = JSON.parse(String(reader.result)); }
      catch (e) { if (msg) msg.textContent = 'ファイルの形式が正しくありません。'; return; }
      var list = data && data.companies;
      if (!Array.isArray(list) || !list.length) {
        if (msg) msg.textContent = 'ファイルの形式が正しくありません。';
        return;
      }
      var ok = window.confirm('この端末にある会社情報を、読み込んだ内容（' + list.length + '社）に置き換えます。よろしいですか？');
      if (!ok) return;
      list.forEach(function (c) { if (!c.id) c.id = 'c' + Math.random().toString(36).slice(2); });
      window.KOBAN_COMPANY.replaceAll(list);
      company = window.KOBAN_COMPANY.getCurrent() || { id: null };
      renderSwitcher();
      document.getElementById('companyMemo').style.display = 'none';
      document.getElementById('csMemoBtn').classList.remove('is-open');
      refreshMemoSub();
      if (msg) msg.textContent = list.length + '社の会社情報を読み込みました。';
    };
    reader.readAsText(file);
  });

  // ---------- 起動 ----------
  renderSwitcher();
  refreshMemoSub();
})();
</script>

  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
