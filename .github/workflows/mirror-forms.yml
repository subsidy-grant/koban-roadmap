name: 様式の控えを最新に保つ

# なぜ動かすか：
#   forms/ にある様式の控えは、配布元が差し替えると古くなる。
#   古い様式で提出すると受け付けてもらえないので、毎日取り直して
#   中身が変わっていたら自動で差し替える。取得日時も記録する。
#   取り込むのは、二次利用が認められていることを規約で確認した
#   配布元だけ（_tools/mirror_forms.py の ALLOWED を見ること）。

on:
  schedule:
    - cron: '0 20 * * *'   # 毎日 05:00 JST（UTC 20:00）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 様式を取り直す
        run: python3 _tools/mirror_forms.py
      - name: 変わっていたらコミット
        id: mirror
        run: |
          # manifest.json と README.md は「点検した日時」を毎回書き直すので、
          # 様式が1つも変わらなくても必ず差分が出る。知らせるかどうかは
          # 実物の様式ファイルが変わったかどうかだけで決める。
          git status --porcelain forms \
            ':(exclude)forms/manifest.json' ':(exclude)forms/README.md' \
            | sed 's/^/  /' > /tmp/changed.txt

          if [ -n "$(git status --porcelain forms)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add forms
            if [ -s /tmp/changed.txt ]; then
              git commit -m "様式の控えを更新（配布元の差し替えを反映）"
            else
              git commit -m "様式の点検日時を更新（中身の差し替えは無し）"
            fi
            git push
          else
            echo "変わりなし"
          fi

          if [ -s /tmp/changed.txt ]; then
            echo "実物の様式が変わった:"; cat /tmp/changed.txt
            echo "changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "実物の様式は変わっていない（点検日時のみ）"
            echo "changed=0" >> "$GITHUB_OUTPUT"
          fi

      # なぜ立てるか：
      #   このワークフローは誰にも知らせずに forms/ を差し替える。
      #   様式の形が変わると自動入力が崩れることがあるので、
      #   気づく手がかりを必ず残す。点検手順は tools/README.md にある。
      - name: 差し替わったことを Issue で知らせる
        if: steps.mirror.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "配布元が様式を差し替えたので、控えを更新しました。"
            echo ""
            echo "## 変わったファイル"
            echo '```'
            cat /tmp/changed.txt
            echo '```'
            echo ""
            echo "## やること（tools/README.md「配布元が様式を差し替えたとき」）"
            echo ""
            echo '```'
            echo "cd D:\\Claudecode\\koban-roadmap"
            echo "git pull"
            echo "python -m http.server 8935      # 別の窓で立てておく"
            echo "python tools\\audit_autofill.py"
            echo "git diff tools\\autofill_audit.json"
            echo "python tools\\sweep_render.py <上の変わったファイル名の一部>"
            echo '```'
            echo ""
            echo "**監査の差分が出なくても、変わった様式は紙にして目で見ること。**"
            echo "控えは「どのセルに何を入れたか」しか持っていないので、"
            echo "列幅だけの変更は差分に出ないまま紙で潰れる。"
            echo ""
            echo "確認して問題なければ、この Issue は閉じてよい。"
            echo ""
            echo "- 実行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/issue.md
          gh issue create \
            --title "様式が差し替わった（$(TZ=Asia/Tokyo date '+%Y-%m-%d') 取得）— 自動入力の点検が必要" \
            --body-file /tmp/issue.md
