name: リンク切れ確認（週次）

# 制度の公式ページ・様式ファイル・出典リンク（2026-07-31時点で計約880件）を毎週叩いて、
# リンク切れと『様式の差し替え』を検出する。人手では追いきれないため。
#   要対応が出た場合 → Issue に書き込む（新規作成せず、開いているものに追記）
#   結果は _tools/link_report.md と _tools/link_status.json にコミットして履歴を残す

on:
  schedule:
    - cron: '0 0 * * 1'      # 毎週月曜 00:00 UTC ＝ 月曜 09:00 JST
  workflow_dispatch:          # 手動でも回せる

permissions:
  contents: write             # レポートと台帳のコミット用
  issues: write               # 要対応の起票用

concurrency:
  group: linkcheck
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet requests

      - name: 判定規則の自己チェック（通信しない）
        run: python3 _tools/test_classify.py

      # documents.html（申請書類の準備）は index.html から作った page_data.js を読む。
      # index.html だけ直して作り直しを忘れると、書類作成ページだけ古い制度が残る。
      # 毎週ここで作り直し、差分が出たら下のコミット手順でそのまま反映する。
      - name: 書類作成ページ用データを作り直す
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 _tools/build_page_data.py

      # 郵便番号は月1回更新される。書類作成ページの住所検索は外部APIではなく
      # 自サイトの zipdata/ を読むので、ここで作り直さないと古いままになる。
      # 変化が無ければファイルの中身も変わらず、コミットも発生しない。
      - name: 郵便番号データを作り直す
        continue-on-error: true      # 日本郵便側が落ちていてもリンク確認は続ける
        run: python3 _tools/build_zipcode.py

      - name: リンクを確認する
        id: check
        run: |
          set +e
          python3 _tools/check_links.py
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # check_links.py は「前回の観測との差」しか見ないため、最初に載せた時点の
      # 表記が既に古いと永久に挙がらない。掲載値と実測値の全数突き合わせで拾う。
      - name: 掲載サイズが実物と合っているか確かめる
        id: docsize
        if: always()
        run: |
          set +e
          python3 _tools/check_doc_size.py
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: 結果を実行サマリーに出す
        if: always()
        run: |
          {
            echo "## リンク確認の結果"
            echo ""
            sed -n '1,20p' _tools/link_report_brief.md
            echo ""
            sed -n '1,12p' _tools/doc_size_report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: レポートを成果物として残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: |
            _tools/link_report.md
            _tools/link_status.json
          retention-days: 90

      - name: 台帳とレポートをコミットする
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _tools/link_status.json _tools/link_report.md _tools/link_report_brief.md _tools/doc_size_report.md page_data.js zipdata
          if git diff --cached --quiet; then
            echo "変化なし。コミットしない。"
          else
            git commit -m "リンク確認: $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') JST 時点の結果"
            git push
          fi

      - name: 要対応ならIssueに書く
        if: always() && (steps.check.outputs.code != '0' || steps.docsize.outputs.code != '0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create linkcheck --description "リンク確認の自動報告" --color D93F0B 2>/dev/null || true

          # 本文はリンク確認とサイズ突き合わせをまとめる
          body=_tools/issue_body.md
          cat _tools/link_report_brief.md > "$body"
          if [ -f _tools/doc_size_report.md ]; then
            printf '\n---\n\n' >> "$body"
            cat _tools/doc_size_report.md >> "$body"
          fi

          # 件名は毎回そのときの中身にする。同じ件名が続くと通知が流されるため
          # （2026-08 に5週続けて同じ件名で赤くなり、見落とされた）。
          title=$(head -n 1 _tools/link_summary.txt 2>/dev/null)
          [ -n "$title" ] || title="リンク確認：要対応の項目があります"

          num=$(gh issue list --label linkcheck --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue edit "$num" --title "$title"
            gh issue comment "$num" --body-file "$body"
            echo "既存のIssue #$num に追記し、件名を更新した: $title"
          else
            gh issue create --title "$title" --label linkcheck --body-file "$body"
            echo "Issueを作成した: $title"
          fi

      - name: 判定を終了コードに反映する
        if: always()
        run: |
          code="${{ steps.check.outputs.code }}"
          # 1 = リンクが切れている（利用者が資料にたどり着けない）→ 赤くする
          # 2 = 目視で見ればよいもの（403・差し替え・移転）→ 落とさない。
          #     公的機関のPDFは微修正で頻繁にサイズが動くため、これで赤くすると
          #     毎週赤くなって本物の切れが埋もれる（2026-08 に5週続けて見落とした）。
          #     内容はIssueに載るので気づけないわけではない。
          if [ "$code" = "1" ]; then exit 1; fi
          exit 0
