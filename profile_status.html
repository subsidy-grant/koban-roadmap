<style>
  :root {
    --paper: #b7c1cd;
    --paper-raised: #ffffff;
    --ink: #191d22;
    --ink-soft: #3d475c;
    --ink-faint: #3d4658;
    --accent: #1e4d78;
    --accent-soft: #b9cfe3;
    --accent-wash: #e3edf5;
    --on-accent: #ffffff;
    --sage: #094758;
    --sage-wash: #dcf1f5;
    --rust: #882e08;
    --rust-wash: #f8e4d8;
    --line: #4f5b6d;
    --shadow: rgba(25, 29, 34, 0.10);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --shadow-btn: 0 2px 4px var(--shadow);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0a0d12; --paper-raised: #2c384b; --ink: #e6e9ee; --ink-soft: #b6c0cf;
      --ink-faint: #96a2b5; --accent: #7fa8d9; --accent-soft: #24344f; --accent-wash: #1a2740;
      --on-accent: #0d1218; --sage: #5fc3d9; --sage-wash: #15262c; --rust: #e88a5a;
      --rust-wash: #2c1c10; --line: #8290ac; --shadow: rgba(0, 0, 0, 0.45);
    }
  }
  :root[data-theme="dark"] {
    --paper: #0a0d12; --paper-raised: #2c384b; --ink: #e6e9ee; --ink-soft: #b6c0cf;
    --ink-faint: #96a2b5; --accent: #7fa8d9; --accent-soft: #24344f; --accent-wash: #1a2740;
    --on-accent: #0d1218; --sage: #5fc3d9; --sage-wash: #15262c; --rust: #e88a5a;
    --rust-wash: #2c1c10; --line: #8290ac; --shadow: rgba(0, 0, 0, 0.45);
  }
  :root[data-theme="light"] {
    --paper: #b7c1cd; --paper-raised: #ffffff; --ink: #191d22; --ink-soft: #3d475c;
    --ink-faint: #3d4658; --accent: #1e4d78; --accent-soft: #b9cfe3; --accent-wash: #e3edf5;
    --on-accent: #ffffff; --sage: #094758; --sage-wash: #dcf1f5; --rust: #882e08;
    --rust-wash: #f8e4d8; --line: #4f5b6d; --shadow: rgba(25, 29, 34, 0.10);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); line-height: 1.8;
    font-family: "BIZ UDPGothic","BIZ UDGothic","Noto Sans JP","Yu Gothic Medium","Hiragino Sans","Meiryo",sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 940px; margin: 0 auto; padding: 1.6rem 1.1rem 5rem; }
  a { color: var(--accent); }

  h1 { font-size: 1.5rem; margin: 0.4rem 0 0.6rem; line-height: 1.6; text-wrap: balance; }
  .lede { color: var(--ink-soft); font-size: 0.98rem; margin: 0 0 0.4rem; max-width: 62ch; }
  .back-link { display: inline-block; font-size: 0.88rem; margin-bottom: 0.8rem; }

  .cs-hint { margin: 0.8rem 0 0; font-size: 0.82rem; color: var(--ink-faint); }
  .empty { color: var(--ink-soft); font-size: 0.93rem; }

  /* ---- 申請一覧（applications.htmlの.app-listと同じ見た目に統一、2026-08-15） ---- */
  .app-list { list-style: none; margin: 0; padding: 0; }
  .app-item { display: flex; align-items: center; gap: 0.7rem; background: var(--paper-raised);
    border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 0.9rem 1.1rem;
    margin-bottom: 0.7rem; box-shadow: var(--shadow-btn); }
  .app-item-main { flex: 1 1 auto; min-width: 0; background: none; border: 0; padding: 0;
    text-align: left; font: inherit; color: var(--ink); cursor: pointer; }
  .app-item-name { font-weight: 700; font-size: 1rem; display: block; }
  .app-item-prog { flex: none; text-align: right; font-size: 0.85rem; color: var(--ink-soft);
    font-variant-numeric: tabular-nums; min-width: 4.6rem; line-height: 1.4; }
  .app-item-prog .n { font-weight: 700; color: var(--accent); }
  .app-item-prog .lbl { display: block; font-size: 0.68rem; color: var(--ink-faint); }

  /* アプリ風のタップフィードバック（他ページと共通） */
  button, .btn, a.btn-link {
    transition: transform 0.08s ease, filter 0.08s ease;
  }
  button:active, .btn:active, a.btn-link:active {
    transform: scale(0.97);
    filter: brightness(0.95);
  }
  @media (prefers-reduced-motion: reduce) {
    button, .btn, a.btn-link { transition: none; }
  }
</style>

<body>
<main>
  <a href="profile.html" class="back-link">← 会社情報 に戻る</a>
  <h1>現在の申請状況</h1>

  <div id="companyStatus"></div>

  <p class="lede" style="margin-top:1.2rem;">表示している件数は、取り寄せ証明書のうちチェックが付いた件数です。<strong>様式の記入状況やお持ちの様式全体の進捗を表すものではありません。</strong>申請ごとの一覧は<a href="applications.html">申請進捗ページ</a>にあります。</p>
</main>

<script src="page_data.js"></script>
<script src="common_docs.js"></script>
<script>
(function () {
  'use strict';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  var K_APPS = 'koban_applications';
  function loadApps() {
    try { var r = localStorage.getItem(K_APPS); return r ? JSON.parse(r) : []; }
    catch (e) { return []; }
  }

  // 表示はapplications.htmlの一覧（.app-list/.app-item）と統一する（2026-08-15、本人指示）。
  // 名前は常に制度名と一致する仕様のため（applications.html参照）、1行表示のみでよい。
  function progressOf(a, CD) {
    if (!CD || !a.programKey) return { done: 0, total: 0 };
    var items = CD.COMMON_DOCS.filter(function (c) { return CD.docApplies(c, a.programKey); });
    var done = items.filter(function (c) { return a.done && a.done[c.id]; }).length;
    return { done: done, total: items.length };
  }
  function renderStatus() {
    var box = document.getElementById('companyStatus');
    if (!box) return;
    var apps = loadApps();
    if (!apps.length) {
      box.innerHTML = '<p class="empty">まだ申請がありません。<a href="applications.html">申請進捗ページ</a>で追加できます。</p>';
      return;
    }
    var CD = window.KOBAN_COMMON_DOCS;
    box.innerHTML = '<ul class="app-list">' + apps.map(function (a) {
      var p = progressOf(a, CD);
      return '<li class="app-item">' +
        '<span class="app-item-main"><span class="app-item-name">' + esc(a.name) + '</span></span>' +
        '<span class="app-item-prog"><span class="n">' + p.done + ' / ' + p.total + '</span>' +
        '<span class="lbl">取り寄せ書類</span></span>' +
        '</li>';
    }).join('') + '</ul>' +
      '<p class="cs-hint"><a href="applications.html">申請進捗ページで詳しく見る・編集する ↗</a></p>';
  }

  renderStatus();
})();
</script>
<script src="app_tabbar.js"></script>
</body>
</html>
