<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e4d78">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="補助金ロードマップ">
<title>申請スケジュールを日付で確認｜補助金活用 業務改善ロードマップ</title>
<meta name="description" content="制度と基準日を入れると、申請までにやることを1つずつに分けて、いつ着手すればよいかを帯で表示します。終わった作業のチェックはこの端末に残ります。">
<link rel="canonical" href="https://subsidy-grant.github.io/koban-roadmap/schedule.html">
<meta name="robots" content="index,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* 配色・基礎はトップページと同じ（藍×橙×花青、2026-08-13、design.md参照） */
  :root {
    --paper: #b7c1cd; --paper-raised: #ffffff; --ink: #191d22; --ink-soft: #3d475c;
    --ink-faint: #3d4658; --accent: #1e4d78; --accent-soft: #b9cfe3; --accent-wash: #e3edf5;
    --on-accent: #ffffff; --sage: #094758; --sage-wash: #dcf1f5; --rust: #882e08;
    --rust-wash: #f8e4d8; --line: #4f5b6d; --shadow: rgba(25, 29, 34, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0a0d12; --paper-raised: #2c384b; --ink: #e6e9ee; --ink-soft: #b6c0cf;
      --ink-faint: #96a2b5; --accent: #7fa8d9; --accent-soft: #24344f; --accent-wash: #1a2740;
      --on-accent: #0d1218; --sage: #5fc3d9; --sage-wash: #15262c; --rust: #e88a5a;
      --rust-wash: #2c1c10; --line: #8290ac; --shadow: rgba(0, 0, 0, 0.45);
    }
  }
  :root[data-theme="dark"] {
    --paper: #0a0d12; --paper-raised: #2c384b; --ink: #e6e9ee; --ink-soft: #b6c0cf;
    --ink-faint: #96a2b5; --accent: #7fa8d9; --accent-soft: #24344f; --accent-wash: #1a2740;
    --on-accent: #0d1218; --sage: #5fc3d9; --sage-wash: #15262c; --rust: #e88a5a;
    --rust-wash: #2c1c10; --line: #8290ac; --shadow: rgba(0, 0, 0, 0.45);
  }
  :root[data-theme="light"] {
    --paper: #b7c1cd; --paper-raised: #ffffff; --ink: #191d22; --ink-soft: #3d475c;
    --ink-faint: #3d4658; --accent: #1e4d78; --accent-soft: #b9cfe3; --accent-wash: #e3edf5;
    --on-accent: #ffffff; --sage: #094758; --sage-wash: #dcf1f5; --rust: #882e08;
    --rust-wash: #f8e4d8; --line: #4f5b6d; --shadow: rgba(27, 35, 51, 0.10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); line-height: 1.8;
    font-family: "BIZ UDPGothic","BIZ UDGothic","Noto Sans JP","Yu Gothic Medium","Hiragino Sans","Meiryo",sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .jp-serif { font-family: "BIZ UDPMincho","BIZ UDMincho","Yu Mincho","Hiragino Mincho ProN",serif; }
  main { max-width: 940px; margin: 0 auto; padding: 1.6rem 1.1rem 5rem; }
  a { color: var(--accent); }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    flex-wrap: wrap; margin-bottom: 1.4rem; }
  .back { font-size: 0.92rem; }
  .theme-btn { border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink-soft);
    border-radius: 6px; padding: 0.45rem 0.8rem; font: inherit; font-size: 0.85rem;
    cursor: pointer; min-height: 44px; }
  h1 { font-size: 1.5rem; margin: 0 0 0.6rem; line-height: 1.6; text-wrap: balance; }
  .lede { color: var(--ink-soft); font-size: 0.98rem; margin: 0 0 0.4rem; max-width: 62ch; }
  .privacy { margin: 1.2rem 0 0; padding: 0.9rem 1.1rem; border-radius: 10px;
    background: var(--sage-wash); border: 1px solid var(--sage); font-size: 0.92rem; }
  section { margin-top: 2rem; scroll-margin-top: 1rem; }
  /* 2026-08-13：背景面同士の明度差が小さく境界がぼやける指摘を受け、影を追加（design.md参照） */
  .picker { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 0.9rem 1.1rem; margin-bottom: 1.2rem;
    box-shadow: 0 1px 3px var(--shadow), 0 1px 2px var(--shadow); }
  .picker select { font: inherit; font-size: 0.95rem; padding: 0.5rem; max-width: 100%; width: 100%;
    min-height: 44px; background: var(--paper-raised); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; }
  .step-ttl { font-weight: 700; font-size: 0.92rem; margin: 0 0 0.5rem;
    padding-left: 0; border-left: none; color: var(--accent); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .prog { height: 8px; background: var(--paper); border: 1px solid var(--line);
    border-radius: 999px; overflow: hidden; margin: 0.4rem 0 0.7rem; }
  .prog > i { display: block; height: 100%; background: var(--sage); }
  .warn { background: var(--rust-wash); border: 1px solid var(--rust); border-radius: 10px;
    padding: 0.8rem 1rem; font-size: 0.9rem; margin: 0 0 1rem; }
  .empty { color: var(--ink-soft); font-size: 0.93rem; background: var(--paper-raised);
    border: 1px dashed var(--line); border-radius: 10px; padding: 1rem 1.1rem; }
  .src-note { font-size: 0.84rem; font-style: italic; color: var(--ink-faint); margin-top: 0.8rem; }

  /* ---- 07 手順とスケジュール（ガント） ----
     左に「やること」、右に帯。帯は日付の目盛りに合わせて置く。
     色は既存の3色の役割どおり（緑=済んだこと・青=案内・橙=落とすと失格） */
  .gt-anchors { background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: 10px; padding: 0.9rem 1.1rem; margin-bottom: 1rem; }
  .gt-anchors .arow { margin-top: 0.7rem; }
  .gt-anchors .arow:first-of-type { margin-top: 0.3rem; }
  .gt-anchors label { display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 0.2rem; }
  .gt-anchors .anote { font-size: 0.82rem; color: var(--ink-soft); margin: 0.15rem 0 0; }
  /* 幅を指定しないと、文字を大きくしたときに日付欄が枠からはみ出す */
  .gt-anchors input[type="date"] { font: inherit; font-size: 0.95rem; padding: 0.45rem 0.5rem;
    min-height: 44px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--paper-raised); color: var(--ink);
    width: 100%; max-width: 16rem; box-sizing: border-box; }
  .gt-prog { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; margin: 0 0 0.6rem; }
  .gt-prog .prog { flex: 1; min-width: 10rem; margin: 0; }
  .gt-prog .num { font-size: 0.88rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  /* 帯の位置は % で置いてあるので、どの画面幅でも期間の全体が枠に収まる。
     横スクロールは使わない（スマホで帯が画面の外に出て見えなくなるため）。 */
  .gt-legend { display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; margin: 0 0 0.5rem;
    font-size: 0.78rem; color: var(--ink-soft); }
  .gt-legend .k { display: inline-flex; align-items: center; gap: 0.35rem; }
  .gt-legend i, .gt-legend i.gt-bar { position: static; transform: none; display: inline-block;
    width: 1.6rem; min-width: 0; height: 10px; border-radius: 5px; flex: none; }
  .gt-legend i.lg-today { width: 0; height: 1rem; border-left: 2px solid var(--rust); border-radius: 0; }
  /* clip にしているのは、hidden だとこの箱がスクロール容器になり、
     月の目盛り（position: sticky）が上に貼り付かなくなるため。 */
  .gt-wrap { border: 1px solid var(--line); border-radius: 10px;
    background: var(--paper-raised); overflow: clip; }
  .gt-inner { width: 100%; }
  .gt-row { display: flex; align-items: stretch; border-bottom: 1px dashed var(--line); }
  .gt-row:last-child { border-bottom: 0; }
  /* 申請の段階（準備・交付申請など）のまとまり。長い制度は手順が20を超えるので、
     いま関係のない段階は畳めるようにする。既定は開いた状態。 */
  .gt-row.phase { background: var(--accent-wash); display: block; padding: 0;
    border-bottom: 1px solid var(--line); }
  .gt-phase { display: flex; align-items: center; gap: 0.6rem; width: 100%;
    font: inherit; font-size: 0.95rem; font-weight: 700; color: var(--ink);
    background: none; border: 0; text-align: left; cursor: pointer;
    min-height: 46px; padding: 0.5rem 0.7rem; }
  .gt-phase:hover { background: var(--accent); color: var(--paper); }
  .gt-phase:hover .cnt, .gt-phase:hover .chev { color: var(--paper); }
  .gt-phase:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .gt-phase .chev { flex: none; color: var(--accent); transition: transform 0.18s ease; }
  .gt-row.phase:not(.is-open) .gt-phase .chev { transform: rotate(-90deg); }
  .gt-phase .nm { flex: 1 1 auto; min-width: 0; }
  .gt-phase .cnt { flex: none; font-size: 0.82rem; font-weight: 400; color: var(--ink-soft);
    font-variant-numeric: tabular-nums; }
  .gt-phase-body.is-closed { display: none; }
  @media print { .gt-phase-body.is-closed { display: block; } }
  .gt-left { flex: 1 1 auto; min-width: 0; padding: 0.5rem 0.6rem;
    border-right: 1px solid var(--line); background: var(--paper-raised); }
  /* 見出し＝1行の要約。補足（もとの文・注意・出典）と一目で見分けられるよう、
     大きさと太さで差を付ける。ここを弱めると全部が同じ濃さの文章に見える。 */
  .gt-name { display: flex; align-items: flex-start; gap: 0.6rem; line-height: 1.5; }
  .gt-name span.t { font-size: 1.08rem; font-weight: 700; color: var(--ink); }
  .gt-name input[type="checkbox"] { width: 24px; height: 24px; margin-top: 0.1rem; flex: none;
    accent-color: var(--sage); }
  /* 終わった手順は、帯の色だけでなく行全体の地色と✓で示す。
     青→緑の色の違いだけだと（特に小さい帯では）変わったことに気づけない。 */
  .gt-row.done { background: var(--sage-wash); }
  .gt-row.done .gt-left { background: var(--sage-wash); }
  /* ✓ は緑のチェックボックスと帯の札で示す。見出しに足すと取り消し線が
     ✓ の上にも掛かって壊れて見えるので、ここには入れない。 */
  .gt-row.done .gt-name span.t { color: var(--ink-faint); text-decoration: line-through; }
  /* 誰がやるのか。自分で動く／頼む／待つ、を色と言葉の両方で示す */
  .gt-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 0.4rem;
    margin: 0.4rem 0 0 2.3rem; }
  /* 文字を拡大したときに札が枠から出ないよう、折り返しは許す */
  .gt-who { font-size: 0.8rem; font-weight: 700; line-height: 1.7; max-width: 100%;
    border: 1px solid; border-radius: 999px; padding: 0.05rem 0.6rem; }
  .gt-who.self { color: var(--accent); border-color: var(--accent); background: var(--accent-wash); }
  .gt-who.other { color: var(--sage); border-color: var(--sage); background: var(--sage-wash); }
  .gt-who.wait { color: var(--ink-soft); border-color: var(--line); background: var(--paper); }
  .gt-desc { font-size: 0.82rem; color: var(--ink-soft); line-height: 1.75;
    margin: 0.3rem 0 0 2.3rem; }
  .gt-meta { font-size: 0.82rem; color: var(--ink-soft); margin: 0.3rem 0 0 2.3rem;
    font-variant-numeric: tabular-nums; }
  .gt-badge { display: inline-block; font-size: 0.75rem; border-radius: 3px; padding: 0 0.35rem;
    border: 1px solid; white-space: nowrap; }
  .gt-b-hard { color: var(--rust); border-color: var(--rust); background: var(--rust-wash); }
  .gt-b-un { color: var(--ink-faint); border-color: var(--line); background: var(--paper); }
  /* overflow: clip は保険。札の位置はJSが測って決めるが、JSが動く前や
     計算が外れたときでも、札がページの横幅を広げてしまわないようにする。 */
  .gt-right { flex: none; width: 42%; position: relative; min-height: 44px; overflow: clip; }
  /* 月の区切り線。ヘッダーの目盛りが画面外でも、帯がいつごろかを線で追える */
  .gt-grid { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); opacity: 0.7; }
  /* 帯＋日付の札。1日だけの用事は点にしかならないので、札のほうが本体 */
  .gt-mark { position: absolute; top: 50%; transform: translateY(-50%); height: 16px; z-index: 2; }
  .gt-mark > i { display: block; width: 100%; min-width: 10px; height: 14px;
    border-radius: 7px; background: var(--accent); }
  .gt-mark.hard > i { background: var(--rust); }
  .gt-mark.doneb > i { background: var(--sage); }
  /* 帯と札は離す。近いと丸い帯と数字がくっついて読みにくい */
  .gt-blab { position: absolute; left: 100%; top: 50%; transform: translateY(-50%);
    margin-left: 0.75rem; font-size: 0.76rem; font-weight: 700; white-space: nowrap;
    color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .gt-mark.flip .gt-blab { left: auto; right: 100%; margin: 0 0.75rem 0 0; }
  .gt-mark.hard .gt-blab { color: var(--rust); }
  .gt-mark.doneb .gt-blab { color: var(--sage); }
  /* 帯が広いとき、または左右どちらにも札を出せないときは帯の中に重ねる。
     色は必ず地の色にする（帯と同じ色だと字が消えるため。この2行は上より後に置く） */
  .gt-mark.inb .gt-blab, .gt-mark.inb.hard .gt-blab, .gt-mark.inb.doneb .gt-blab {
    left: 0; right: auto; width: 100%; margin: 0; text-align: center; color: var(--paper); }
  .gt-bar { position: absolute; top: 50%; transform: translateY(-50%); height: 14px;
    min-width: 8px; border-radius: 7px; background: var(--accent); }
  .gt-bar.hard { background: var(--rust); }
  .gt-bar.doneb { background: var(--sage); }
  /* 斜線の帯は幅いっぱいに引くので、「ずっと作業する」と読まれないよう字を入れる */
  .gt-bar.unknown { background: repeating-linear-gradient(45deg, var(--line), var(--line) 4px, transparent 4px, transparent 8px);
    border: 1px solid var(--line); height: 18px; display: flex; align-items: center;
    justify-content: center; }
  .gt-bar.unknown em { font-style: normal; font-size: 0.7rem; color: var(--ink-soft);
    background: var(--paper-raised); padding: 0 0.35rem; border-radius: 3px; }
  /* 月の目盛りは、下へ読み進めても見えていないと帯の意味が分からない。
     固定ナビ（実測 PC61px / スマホ58px）の下に貼り付ける。 */
  .gt-head { display: flex; border-bottom: 1px solid var(--ink); position: sticky; top: 3.9rem; z-index: 3;
    background: var(--paper-raised); }
  .gt-head .gt-left { font-size: 0.8rem; color: var(--ink-soft); }
  /* 右端の月名がはみ出して横スクロールを生まないよう、目盛りの帯で切る */
  .gt-ticks { position: relative; height: 1.9rem; min-height: 0; overflow: hidden; }
  .gt-tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line);
    font-size: 0.7rem; color: var(--ink-soft); padding-left: 0.2rem; white-space: nowrap; }
  .gt-today { position: absolute; top: 0; bottom: 0; border-left: 2px solid var(--rust); z-index: 1; }
  .gt-late { color: var(--rust); font-weight: 700; }
  .gt-warn { font-size: 0.8rem; color: var(--ink-soft); margin: 0.3rem 0 0 2.3rem; line-height: 1.7;
    border-left: 3px solid var(--line); padding-left: 0.6rem; }
  .gt-warn.hard { color: var(--rust); border-left-color: var(--rust); }
  .gt-src { font-size: 0.74rem; color: var(--ink-faint); margin: 0.3rem 0 0 2.3rem; }
  .gt-src a { color: inherit; }
  /* 狭い画面では左右に並べると、やることの文が細長い柱になって読めない。
     上に文・下に帯の2段に積み替えて、横スクロールなしで両方見えるようにする。 */
  @media (max-width: 760px) {
    .gt-row { flex-direction: column; }
    .gt-left { border-right: 0; }
    .gt-right { width: 100%; min-height: 30px; border-top: 1px dashed var(--line); }
    .gt-head { flex-direction: row; }
    .gt-head .gt-left { display: none; }
    .gt-head .gt-ticks { width: 100%; border-top: 0; }
  }
  @media print {
    .gt-wrap { break-inside: auto; }
    .gt-row { break-inside: avoid; }
  }
  /* このページはガント専用で固定ナビが無いため、月の目盛りは画面の最上部に貼り付ける */
  .gt-head { top: 0; }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <p class="back"><a href="./#gantt">← 補助金活用 業務改善ロードマップ に戻る</a></p>
    <button type="button" class="theme-btn" id="themeBtn" onclick="toggleTheme()">画面を暗くする</button>
  </div>

  <h1>申請スケジュールを日付で確認</h1>
  <p class="lede">制度と基準になる日付を入れると、申請までにやることを1つずつに分けて、<strong>いつ着手すればよいかを帯で表示</strong>します。終わった作業にチェックを付けると、進み具合がこの端末に残ります。<strong>これは要件を満たした場合に支給・交付されるもので、申請すれば必ず受け取れるものではありません。</strong></p>
  <p class="privacy"><strong>入れた日付とチェックは、お使いの端末（ブラウザ）の中だけに保存されます。</strong>どこにも送られません。</p>

  <section id="gantt">
    <div class="picker">
      <p class="step-ttl">手順1　制度を選ぶ</p>
      <label class="sr-only" for="gtScheme">制度</label>
      <select id="gtScheme"><option value="">制度を選んでください</option></select>
    </div>
    <div id="gtAnchors"></div>
    <div id="gtOut"></div>
  </section>
</main>

<script>
  // 画面の明暗（トップページと同じキーを使う）
  window.toggleTheme = function () {
    var cur = document.documentElement.getAttribute('data-theme');
    if (!cur) cur = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    syncThemeBtn();
  };
  function syncThemeBtn() {
    var btn = document.getElementById('themeBtn');
    if (!btn) return;
    var cur = document.documentElement.getAttribute('data-theme');
    if (!cur) cur = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    btn.textContent = cur === 'dark' ? '画面を明るくする' : '画面を暗くする';
  }
  (function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
<script src="gantt_data.js"></script>
<script src="gantt_ui.js"></script>
<script>
  initGantt();
  syncThemeBtn();
  // トップページの概要から「この制度の詳細を見る」で飛んできたときは、
  // その制度を選んだ状態で開く（もう一度選ばせない）
  (function () {
    var m = /[?&]scheme=([^&]+)/.exec(location.search);
    if (!m) return;
    var key = decodeURIComponent(m[1]);
    var sel = document.getElementById('gtScheme');
    if (!sel) return;
    var ok = Array.prototype.some.call(sel.options, function (o) { return o.value === key; });
    if (!ok) return;
    sel.value = key;
    sel.dispatchEvent(new Event('change'));
    document.getElementById('gantt').scrollIntoView();
  })();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
