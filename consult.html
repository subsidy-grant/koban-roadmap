<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1544c4">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="補助金ロードマップ">
<title>専門家に相談｜補助金活用 業務改善ロードマップ</title>

<link rel="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=M+PLUS+Rounded+1c:wght@700;800;900&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* 配色・書体はサイト共通のデザインシステム（design.md）に合わせる。program.htmlと同じ値。 */
  :root {
    --paper: #e8e0d2; --paper-raised: #ffffff; --ink: #1b1a17; --ink-soft: #4f4a43;
    --ink-faint: #5d574f; --accent: #1544c4; --accent-soft: #a9c1f3; --accent-wash: #e7eefc;
    --on-accent: #ffffff; --sage: #0a6d50; --sage-wash: #d6f0e4; --rust: #c93c07;
    --rust-wash: #fde3d4; --line: #cdc0aa; --shadow: rgba(60, 46, 26, 0.16);
    --shadow-card: 0 1px 2px rgba(60,46,26,0.10), 0 4px 12px rgba(60,46,26,0.10);
    --shadow-card-strong: 0 2px 4px rgba(60,46,26,0.12), 0 10px 26px rgba(60,46,26,0.16);
    --paper-sunken: #d0c2a8;
    --line-strong: #b3a48b;
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --shadow-btn: 0 2px 4px var(--shadow);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0e0c0a; --paper-raised: #2d2720; --ink: #f4eee3; --ink-soft: #cabfad;
      --ink-faint: #ab9f8c; --accent: #8fb2ff; --accent-soft: #26385e; --accent-wash: #142640;
      /* 夜間はコバルトが明るいので、その上に置く文字は白ではなく地の色にする
         （現状このページでは未使用だが、他ページと定義を揃えておく） */
      --on-accent: #08121e;
      --sage: #3fd6ac; --sage-wash: #0f2b24; --rust: #ff8a5c; --rust-wash: #33200f;
      --line: #385578; --shadow: rgba(0, 0, 0, 0.5);
    --shadow-card: 0 1px 2px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.35);
    --shadow-card-strong: 0 2px 4px rgba(0,0,0,0.5), 0 10px 26px rgba(0,0,0,0.45);
    --paper-sunken: #1a1712;
    --line-strong: #6d5e49;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); line-height: 1.8;
    font-family: "BIZ UDPGothic","BIZ UDGothic","Noto Sans JP","Yu Gothic Medium","Hiragino Sans","Meiryo",sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .jp-serif { font-family: "M PLUS Rounded 1c", "Noto Sans JP","BIZ UDPGothic","BIZ UDGothic","Yu Gothic Medium","Yu Gothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Meiryo",sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 2.2rem 1.1rem 1.5rem; }
  a { color: var(--accent); }
  h1 { font-size: 1.35rem; margin: 0 0 1rem; }

  @media print { body { display: none; } }
</style>
</head>
<body>
<main>
  <h1>専門家に相談する</h1>

  <div id="consultPanel"></div>
</main>

<script src="experts_data.js"></script>
<script src="consult.js"></script>
<script>
(function () {
  'use strict';
  // このページは特定の制度に紐づかない相談入口なので、制度種別（kind）は絞らず
  // アンケートのQ1（相談テーマ）だけで専門家を選ぶ。
  var panel = document.getElementById('consultPanel');
  if (window.KOBAN_CONSULT && panel) {
    window.KOBAN_CONSULT.mount(panel, { kind: 'other' });
  }
})();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
<script src="app_tabbar.js"></script>
</body>
</html>
