<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0057c2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="補助金ロードマップ">
<title>専門家に相談｜補助金活用 業務改善ロードマップ</title>
<meta name="description" content="提携専門家（社会保険労務士・中小企業診断士等）に、LINEやメールで直接ご相談いただけます。">
<link rel="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=M+PLUS+Rounded+1c:wght@700;800;900&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* 配色・書体はサイト共通のデザインシステム（design.md）に合わせる。program.htmlと同じ値。 */
  :root {
    --paper: #eaf1fb; --paper-raised: #ffffff; --ink: #0c2036; --ink-soft: #3a5170;
    --ink-faint: #4d6a8a; --accent: #0057c2; --accent-soft: #bcd7f7; --accent-wash: #e2edfb;
    --on-accent: #ffffff; --sage: #0d8a6e; --sage-wash: #dcf5ee; --rust: #d84315;
    --rust-wash: #fde3d6; --line: #a9c2e0; --shadow: rgba(12, 32, 54, 0.12);
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --shadow-btn: 0 2px 4px var(--shadow);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #081422; --paper-raised: #16283d; --ink: #eaf1fb; --ink-soft: #b7cbe4;
      --ink-faint: #93abc9; --accent: #5b9df5; --accent-soft: #1c3454; --accent-wash: #142640;
      --sage: #3fd6ac; --sage-wash: #0f2b24; --rust: #ff8a5c; --rust-wash: #33200f;
      --line: #385578; --shadow: rgba(0, 0, 0, 0.5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); line-height: 1.8;
    font-family: "BIZ UDPGothic","BIZ UDGothic","Noto Sans JP","Yu Gothic Medium","Hiragino Sans","Meiryo",sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .jp-serif { font-family: "M PLUS Rounded 1c", "Noto Sans JP","BIZ UDPGothic","BIZ UDGothic","Yu Gothic Medium","Yu Gothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Meiryo",sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 2.2rem 1.1rem 1.5rem; }
  a { color: var(--accent); }
  h1 { font-size: 1.35rem; margin: 0 0 0.4rem; }
  .lede { color: var(--ink-soft); font-size: 0.92rem; margin: 0 0 1.6rem; }

  @media print { body { display: none; } }
</style>
</head>
<body>
<main>
  <h1>専門家に相談する</h1>
  <p class="lede">提携専門家（社会保険労務士・中小企業診断士等）に、LINEやメールで直接ご相談いただけます。かんたんな質問にお答えいただくと、合う専門家と相談メッセージのひな形をご用意します。</p>

  <div id="consultPanel"></div>
</main>

<script src="experts_data.js"></script>
<script src="consult.js"></script>
<script>
(function () {
  'use strict';
  // このページは特定の制度に紐づかない相談入口なので、制度種別（kind）は絞らず
  // アンケートのQ1（相談テーマ）だけで専門家を選ぶ。
  var panel = document.getElementById('consultPanel');
  if (window.KOBAN_CONSULT && panel) {
    window.KOBAN_CONSULT.mount(panel, { kind: 'other' });
  }
})();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
<script src="app_tabbar.js"></script>
</body>
</html>
