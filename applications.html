<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0057c2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="補助金ロードマップ">
<title>申請の進み具合｜補助金活用 業務改善ロードマップ</title>
<meta name="description" content="複数の補助金・助成金に申請するとき、それぞれの取り寄せ書類の進み具合をまとめて管理するページ。申請ごとにチェックリストを分けて残せます。登録不要・処理はお使いの端末の中だけ。">
<link rel="canonical" href="https://subsidy-grant.github.io/koban-roadmap/applications.html">
<meta name="robots" content="index,follow">
<meta property="og:type" content="article">
<meta property="og:site_name" content="補助金活用 業務改善ロードマップ">
<meta property="og:title" content="申請の進み具合｜複数申請をまとめて管理">
<meta property="og:description" content="申請ごとに取り寄せ書類のチェックリストを分けて残せます。">
<meta property="og:url" content="https://subsidy-grant.github.io/koban-roadmap/applications.html">
<meta property="og:locale" content="ja_JP">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* 配色・書体はサイト共通のデザインシステム（design.md）に合わせる。documents.htmlと同じ値 */
  :root {
    --paper: #eaf1fb;
    --paper-raised: #ffffff;
    --ink: #0c2036;
    --ink-soft: #3a5170;
    --ink-faint: #4d6a8a;
    --accent: #0057c2;
    --accent-soft: #bcd7f7;
    --accent-wash: #e2edfb;
    --on-accent: #ffffff;
    --sage: #0d8a6e;
    --sage-wash: #dcf5ee;
    --rust: #d84315;
    --rust-wash: #fde3d6;
    --line: #a9c2e0;
    --shadow: rgba(12, 32, 54, 0.12);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --shadow-btn: 0 2px 4px var(--shadow);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #081422; --paper-raised: #16283d; --ink: #eaf1fb; --ink-soft: #b7cbe4;
      --ink-faint: #93abc9; --accent: #5b9df5; --accent-soft: #1c3454; --accent-wash: #142640;
      --on-accent: #0d1218; --sage: #3fd6ac; --sage-wash: #0f2b24; --rust: #ff8a5c;
      --rust-wash: #33200f; --line: #385578; --shadow: rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --paper: #081422; --paper-raised: #16283d; --ink: #eaf1fb; --ink-soft: #b7cbe4;
    --ink-faint: #93abc9; --accent: #5b9df5; --accent-soft: #1c3454; --accent-wash: #142640;
    --on-accent: #0d1218; --sage: #3fd6ac; --sage-wash: #0f2b24; --rust: #ff8a5c;
    --rust-wash: #33200f; --line: #385578; --shadow: rgba(0, 0, 0, 0.5);
  }
  :root[data-theme="light"] {
    --paper: #eaf1fb; --paper-raised: #ffffff; --ink: #0c2036; --ink-soft: #3a5170;
    --ink-faint: #4d6a8a; --accent: #0057c2; --accent-soft: #bcd7f7; --accent-wash: #e2edfb;
    --on-accent: #ffffff; --sage: #0d8a6e; --sage-wash: #dcf5ee; --rust: #d84315;
    --rust-wash: #fde3d6; --line: #a9c2e0; --shadow: rgba(12, 32, 54, 0.12);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); line-height: 1.8;
    font-family: "BIZ UDPGothic","BIZ UDGothic","Noto Sans JP","Yu Gothic Medium","Hiragino Sans","Meiryo",sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .jp-serif { font-family: "Noto Sans JP","BIZ UDPGothic","BIZ UDGothic","Yu Gothic Medium","Yu Gothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Meiryo",sans-serif; }
  main { max-width: 780px; margin: 0 auto; padding: 2.5rem 1.1rem 1.5rem; }
  a { color: var(--accent); }

  h1 { font-size: 1.5rem; margin: 0.4rem 0 0.6rem; line-height: 1.6; text-wrap: balance; }
  .lede { color: var(--ink-soft); font-size: 0.98rem; margin: 0 0 1.4rem; max-width: 62ch; }

  .btn { border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent);
    border-radius: var(--radius-md); padding: 0.6rem 1.1rem; font: inherit; font-size: 0.92rem;
    cursor: pointer; min-height: 44px; box-shadow: var(--shadow-btn); }
  .btn.ghost { background: var(--paper-raised); color: var(--accent); }
  .btn.danger { background: var(--paper-raised); color: var(--rust); border-color: var(--rust); }
  .btn:hover { filter: brightness(1.08); }
  .btn[disabled], .btn[disabled]:hover { background: var(--paper); color: var(--ink-faint);
    border-color: var(--line); cursor: not-allowed; filter: none; }

  .pcard { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 1rem 1.1rem; margin-bottom: 0.9rem; box-shadow: 0 1px 3px var(--shadow), 0 1px 2px var(--shadow); }
  .pcard .meta { font-size: 0.86rem; color: var(--ink-soft); margin: 0 0 0.5rem; }
  .pcard-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.6rem; }
  .pcard-head h3 { margin: 0; }
  .pcard-close { flex: none; background: none; border: 1px solid var(--line); color: var(--ink-faint);
    border-radius: 6px; min-height: 40px; min-width: 40px; font-size: 0.85rem; cursor: pointer; }
  .pcard-close:hover { border-color: var(--rust); color: var(--rust); }
  .btn-link { display: inline-block; padding: 0.5rem 0.9rem; border: 1px solid var(--accent);
    border-radius: var(--radius-md); background: var(--accent-wash); color: var(--accent);
    font-weight: 700; font-size: 0.86rem; text-decoration: none; min-height: 44px;
    box-sizing: border-box; line-height: 1.6; }
  .btn-link:active { transform: scale(0.98); }
  .empty { color: var(--ink-soft); font-size: 0.93rem; background: var(--paper-raised);
    border: 1px dashed var(--line); border-radius: 10px; padding: 1rem 1.1rem; }
  .warn { background: var(--rust-wash); border: 1px solid var(--rust); border-radius: 10px;
    padding: 0.9rem 1.1rem; font-size: 0.92rem; margin: 1rem 0; }
  .warn strong { color: var(--rust); }

  /* ---- 申請一覧 ---- */
  .app-list { list-style: none; margin: 0 0 1.2rem; padding: 0; }
  .app-item { display: flex; align-items: center; gap: 0.7rem; background: var(--paper-raised);
    border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 0.9rem 1.1rem;
    margin-bottom: 0.7rem; box-shadow: var(--shadow-btn); }
  .app-item.is-current { border-color: var(--accent); border-width: 2px; }
  .app-item-main { flex: 1 1 auto; min-width: 0; background: none; border: 0; padding: 0;
    text-align: left; font: inherit; color: var(--ink); cursor: pointer; }
  .app-item-name { font-weight: 700; font-size: 1rem; display: block; }
  .app-item-meta { font-size: 0.82rem; color: var(--ink-soft); display: block; margin-top: 0.15rem; }
  .app-item-prog { flex: none; text-align: right; font-size: 0.85rem; color: var(--ink-soft);
    font-variant-numeric: tabular-nums; min-width: 4.6rem; line-height: 1.4; }
  .app-item-prog .n { font-weight: 700; color: var(--accent); }
  .app-item-prog .lbl { display: block; font-size: 0.68rem; color: var(--ink-faint); }
  .app-item-del { flex: none; background: none; border: 1px solid var(--line); color: var(--ink-faint);
    border-radius: 6px; min-height: 40px; min-width: 40px; font-size: 0.85rem; cursor: pointer; }
  .app-item-del:hover { border-color: var(--rust); color: var(--rust); }

  /* ---- 新規作成フォーム ---- */
  .new-app { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: flex-end; margin-bottom: 1.6rem; }
  .new-app-field { flex: 1 1 14rem; }
  .new-app-field label { display: block; font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 0.25rem; }
  .new-app-field input, .new-app-field select { width: 100%; font: inherit; font-size: 0.95rem;
    padding: 0.55rem 0.7rem; border: 1px solid var(--line); border-radius: var(--radius-md);
    background: var(--paper-raised); color: var(--ink); min-height: 44px; }
  .new-app-search { position: relative; }
  .search-suggest { list-style: none; margin: 0.3rem 0 0; padding: 0.3rem; position: absolute;
    top: 100%; left: 0; right: 0; z-index: 5; max-height: 15rem; overflow-y: auto;
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-md);
    box-shadow: 0 4px 12px var(--shadow); }
  .search-suggest li { border-radius: var(--radius-sm); }
  .search-suggest button { display: block; width: 100%; text-align: left; font: inherit; font-size: 0.92rem;
    background: none; border: none; color: var(--ink); padding: 0.5rem 0.6rem; cursor: pointer;
    min-height: 44px; border-radius: var(--radius-sm); }
  .search-suggest button:hover, .search-suggest button.is-active { background: var(--accent-wash); color: var(--accent); }
  .new-app-search .picked { display: none; align-items: center; justify-content: space-between; gap: 0.5rem;
    padding: 0.55rem 0.7rem; border: 1px solid var(--accent); border-radius: var(--radius-md);
    background: var(--accent-wash); color: var(--accent); font-weight: 700; font-size: 0.92rem; min-height: 44px; }
  .new-app-search.has-picked .picked { display: flex; }
  .new-app-search.has-picked #newAppProgramSearch { display: none; }
  .picked button { background: none; border: none; color: inherit; font: inherit; cursor: pointer;
    min-height: 32px; padding: 0.2rem 0.4rem; }

  /* ---- チェックリスト（documents.htmlの04と同じ見た目） ---- */
  .prog { height: 8px; background: var(--paper); border: 1px solid var(--line);
    border-radius: 999px; overflow: hidden; margin: 0.4rem 0 0.7rem; }
  .prog > i { display: block; height: 100%; background: var(--sage); }
  .phase-ttl { font-size: 0.86rem; color: var(--accent); font-weight: 700; margin: 0.8rem 0 0.3rem; }
  ul.checks { list-style: none; margin: 0; padding: 0; }
  ul.checks li { border-bottom: 1px dashed var(--line); }
  ul.checks li:last-child { border-bottom: 0; }
  ul.checks label { display: flex; align-items: flex-start; gap: 0.6rem; padding: 0.55rem 0.2rem;
    cursor: pointer; min-height: 44px; }
  ul.checks input[type="checkbox"] { width: 22px; height: 22px; margin-top: 0.25rem; flex: none;
    accent-color: var(--sage); }
  ul.checks .fn { flex: 1; font-size: 0.92rem; }
  ul.checks li.done .fn { color: var(--ink-faint); text-decoration: line-through; }
  .ft { font-size: 0.72rem; border: 1px solid var(--line); border-radius: 4px;
    padding: 0.05rem 0.35rem; color: var(--ink-soft); flex: none; margin-top: 0.35rem; }
  .who { display: inline-block; font-size: 0.76rem; line-height: 1.5; border-radius: 4px;
    padding: 0.05rem 0.4rem; white-space: nowrap; border: 1px solid; }
  .who-sage { background: var(--sage-wash); color: var(--sage); border-color: var(--sage); }
  .who-accent { background: var(--accent-wash); color: var(--accent); border-color: var(--accent); }
  .who-rust { background: var(--rust-wash); color: var(--rust); border-color: var(--rust); }
  .pick-jump { font-size: 0.85rem; }
  .src-note { font-size: 0.84rem; font-style: italic; color: var(--ink-faint); margin-top: 0.8rem; }

  /* アプリ風のタップフィードバック（2026-08-15、design.md参照）。
     押せるボタン・カードに、押した瞬間の沈み込みを追加する */
  button, .btn, .btn-step, a.btn-link, .pt-btn, .theme-btn, .fav-print-btn,
  .sort-btns button {
    transition: transform 0.08s ease, filter 0.08s ease;
  }
  button:active, .btn:active, .btn-step:active, a.btn-link:active, .pt-btn:active,
  .theme-btn:active, .fav-print-btn:active, .sort-btns button:active {
    transform: scale(0.97);
    filter: brightness(0.95);
  }
  @media (prefers-reduced-motion: reduce) {
    button, .btn, .btn-step, a.btn-link, .pt-btn, .theme-btn, .fav-print-btn,
    .sort-btns button { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1>申請の進み具合</h1>

  <div class="new-app">
    <div class="new-app-field new-app-search" id="newAppSearchWrap">
      <label for="newAppProgramSearch">制度を検索して追加</label>
      <input type="search" id="newAppProgramSearch" placeholder="制度名で検索（例：持続化、キャリアアップ）" autocomplete="off">
      <ul id="newAppProgramList" class="search-suggest" hidden></ul>
      <div class="picked" id="newAppPicked">
        <span id="newAppPickedName"></span>
        <button type="button" id="newAppPickedClear" aria-label="選び直す">✕</button>
      </div>
      <select id="newAppProgram" style="display:none;"><option value="">制度を選ぶ</option></select>
    </div>
    <button type="button" class="btn" id="newAppBtn" disabled>申請を追加</button>
  </div>

  <div id="appList"></div>

  <section id="appDetail" style="display:none;">
    <div class="pcard">
      <div class="pcard-head">
        <h3 id="appDetailName"></h3>
        <button type="button" class="pcard-close" id="appDetailCloseBtn" aria-label="閉じる">✕</button>
      </div>
      <p class="meta" id="appDetailMeta"></p>
      <label for="appDetailProgram" style="display:block;font-size:0.86rem;color:var(--ink-soft);margin-bottom:0.3rem;">制度</label>
      <select id="appDetailProgram" style="width:100%;font:inherit;font-size:0.95rem;padding:0.5rem 0.6rem;border:1px solid var(--line);border-radius: var(--radius-md);background:var(--paper-raised);color:var(--ink);min-height:44px;margin-bottom:0.8rem;">
        <option value="">制度を選ぶと、必要な書類だけに絞られます</option>
      </select>
      <p class="meta" id="appDetailDone"></p>
      <div class="prog"><i id="appDetailBar" style="width:0%;"></i></div>
      <div id="appDetailChecks"></div>
    </div>
    <p style="margin-top:1rem;font-size:0.9rem;color:var(--ink-soft);">
      制度ごとに必要な書類は違います。<strong>最終確認は必ず各制度の「公募要領」の提出書類一覧で行ってください。</strong>ここに無い書類を求められることもあります。様式そのものは<a href="documents.html">申請書類の準備ページ</a>で選んで記入します。
    </p>
    <p class="src-note" id="appDetailSource"></p>
  </section>
</main>

<script src="page_data.js"></script>
<script src="common_docs.js"></script>
<script>
(function () {
  'use strict';

  var D = window.KOBAN_DATA || { programs: {}, docs: {} };
  var CD = window.KOBAN_COMMON_DOCS;
  var COMMON_DOCS = CD.COMMON_DOCS;
  var docApplies = CD.docApplies;

  var K_APPS = 'koban_applications';

  function load(key, fallback) {
    try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : fallback; }
    catch (e) { return fallback; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (e) { return false; }
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function whoBadge(who) {
    var cls = CD.whoBadgeClass(who);
    return '<span class="who who-' + cls + '">' + esc(who) + '</span>';
  }

  // ---------- 申請の一覧・作成・削除 ----------
  // 1件 = { id, name, programKey, createdAt(ISO文字列), done:{docId:1,...} }
  // createdAt は Date.now() を使わず、作成順が分かればよいので連番カウンタにする
  var apps = load(K_APPS, []);
  var seq = load('koban_applications_seq', 0);
  var currentId = null;

  function nextId() {
    seq++; save('koban_applications_seq', seq);
    return 'app' + seq;
  }
  function findApp(id) { return apps.filter(function (a) { return a.id === id; })[0] || null; }
  function saveApps() { save(K_APPS, apps); }

  function fillProgramSelect(sel) {
    var keys = Object.keys(D.programs || {}).sort(function (a, b) {
      return ((D.programs[a] || {}).name || '').localeCompare(((D.programs[b] || {}).name || ''), 'ja');
    });
    keys.forEach(function (k) {
      var opt = document.createElement('option');
      opt.value = k;
      opt.textContent = (D.programs[k] || {}).name || k;
      sel.appendChild(opt);
    });
  }

  function progressOf(app) {
    var items = COMMON_DOCS.filter(function (c) { return docApplies(c, app.programKey); });
    var done = items.filter(function (c) { return app.done && app.done[c.id]; }).length;
    return { done: done, total: items.length };
  }

  function renderAppList() {
    var box = document.getElementById('appList');
    if (!apps.length) {
      box.innerHTML = '<p class="empty">まだ申請がありません。上のフォームから追加してください。</p>';
      return;
    }
    var html = '<ul class="app-list">' + apps.map(function (a) {
      var p = progressOf(a);
      return '<li class="app-item' + (a.id === currentId ? ' is-current' : '') + '">' +
        '<button type="button" class="app-item-main" data-id="' + esc(a.id) + '">' +
        '<span class="app-item-name">' + esc(a.name) + '</span>' +
        '</button>' +
        '<span class="app-item-prog"><span class="n">' + p.done + ' / ' + p.total + '</span>' +
        '<span class="lbl">取り寄せ書類</span></span>' +
        '<button type="button" class="app-item-del" data-id="' + esc(a.id) + '" aria-label="この申請を削除">✕</button>' +
        '</li>';
    }).join('') + '</ul>';
    box.innerHTML = html;
    box.querySelectorAll('.app-item-main').forEach(function (b) {
      b.addEventListener('click', function () { selectApp(b.getAttribute('data-id')); });
    });
    box.querySelectorAll('.app-item-del').forEach(function (b) {
      b.addEventListener('click', function () { deleteApp(b.getAttribute('data-id')); });
    });
  }

  function selectApp(id) {
    currentId = id;
    renderAppList();
    renderDetail();
    var detail = document.getElementById('appDetail');
    if (detail) detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function closeDetail() {
    currentId = null;
    document.getElementById('appDetail').style.display = 'none';
    renderAppList();
  }

  function deleteApp(id) {
    var a = findApp(id);
    if (!a) return;
    if (!window.confirm('「' + a.name + '」を削除します。チェックした進み具合も消えます。よろしいですか？')) return;
    apps = apps.filter(function (x) { return x.id !== id; });
    saveApps();
    if (currentId === id) {
      currentId = null;
      document.getElementById('appDetail').style.display = 'none';
    }
    renderAppList();
  }

  function toggleDone(appId, docId, on) {
    var a = findApp(appId);
    if (!a) return;
    if (!a.done) a.done = {};
    if (on) a.done[docId] = 1; else delete a.done[docId];
    saveApps();
    renderAppList();
    renderDetail();
  }

  function renderDetail() {
    var section = document.getElementById('appDetail');
    var a = findApp(currentId);
    if (!a) { section.style.display = 'none'; return; }
    section.style.display = '';
    document.getElementById('appDetailName').textContent = a.name;
    var sel = document.getElementById('appDetailProgram');
    sel.value = a.programKey || '';

    var key = a.programKey || '';
    var items = COMMON_DOCS.filter(function (c) { return docApplies(c, key); });
    var progName = key ? ((D.programs[key] || {}).name || key) : '';
    document.getElementById('appDetailMeta').textContent = key
      ? progName + 'に必要な書類だけを表示しています。'
      : '制度を選ぶと、必要な書類だけに絞られます。今はすべての書類を表示しています。';
    var doneList = document.getElementById('appDetailDone');
    var barEl = document.getElementById('appDetailBar');
    var checksEl = document.getElementById('appDetailChecks');
    if (!items.length) {
      doneList.textContent = '';
      barEl.style.width = '0%';
      checksEl.innerHTML = '<p class="empty">この制度で取り寄せが必要な共通書類はありません。</p>';
      document.getElementById('appDetailSource').textContent = '';
      return;
    }
    var done = items.filter(function (c) { return a.done && a.done[c.id]; }).length;
    var pct = Math.round(done * 100 / items.length);
    doneList.textContent = done + ' / ' + items.length + ' 件そろいました。';
    barEl.style.width = pct + '%';

    var groups = [['apply', '申請のときに出す'], ['report', '事業が終わったあとに出す']];
    checksEl.innerHTML = groups.map(function (g) {
      var list = items.filter(function (c) { return c.when === g[0]; });
      if (!list.length) return '';
      return '<p class="phase-ttl">' + g[1] + '</p><ul class="checks">' +
        list.map(function (c) {
          var on = !!(a.done && a.done[c.id]);
          var cbId = 'appChk_' + a.id + '_' + c.id;
          return '<li class="' + (on ? 'done' : '') + '"><label for="' + cbId + '">' +
            '<input type="checkbox" id="' + cbId + '"' + (on ? ' checked' : '') + '>' +
            '<span class="ft">' + (c.third ? '要依頼' : '自分で') + '</span>' +
            '<span class="fn">' + whoBadge(c.who) + ' ' + esc(c.doc) +
            '<span style="display:block;color:var(--ink-faint);font-size:0.82rem;">' +
            esc(c.where) + '／' + (c.days === 1 ? '当日' : '〜' + c.days + '日') +
            '　' + esc(c.note) + '</span></span></label></li>';
        }).join('') + '</ul>';
    }).join('');
    checksEl.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var docId = cb.id.replace('appChk_' + a.id + '_', '');
        toggleDone(a.id, docId, cb.checked);
      });
    });
    document.getElementById('appDetailSource').textContent = CD.COMMON_DOCS_SOURCE;
  }

  // ---------- 起動 ----------
  fillProgramSelect(document.getElementById('newAppProgram'));
  fillProgramSelect(document.getElementById('appDetailProgram'));
  document.getElementById('appDetailCloseBtn').addEventListener('click', closeDetail);

  // ---------- 新規作成：制度を検索して選ぶ ----------
  // 「申請の名前」欄は廃止し、選んだ制度名をそのまま申請名として使う
  // （2026-08-15、名前欄と制度名の重複表示の解消を兼ねる、本人指示）。
  (function initProgramSearch() {
    var searchEl = document.getElementById('newAppProgramSearch');
    var listEl = document.getElementById('newAppProgramList');
    var progEl = document.getElementById('newAppProgram');
    var wrapEl = document.getElementById('newAppSearchWrap');
    var pickedNameEl = document.getElementById('newAppPickedName');
    var clearBtn = document.getElementById('newAppPickedClear');
    var addBtn = document.getElementById('newAppBtn');
    var keys = Object.keys(D.programs || {}).sort(function (a, b) {
      return ((D.programs[a] || {}).name || '').localeCompare(((D.programs[b] || {}).name || ''), 'ja');
    });

    function pick(key) {
      progEl.value = key;
      pickedNameEl.textContent = (D.programs[key] || {}).name || key;
      wrapEl.classList.add('has-picked');
      listEl.hidden = true;
      addBtn.disabled = false;
    }
    function clearPick() {
      progEl.value = '';
      wrapEl.classList.remove('has-picked');
      searchEl.value = '';
      addBtn.disabled = true;
      searchEl.focus();
    }
    function renderSuggest() {
      var q = searchEl.value.trim();
      if (!q) { listEl.hidden = true; listEl.innerHTML = ''; return; }
      var hits = keys.filter(function (k) {
        return ((D.programs[k] || {}).name || '').indexOf(q) !== -1;
      }).slice(0, 20);
      if (!hits.length) {
        listEl.innerHTML = '<li style="padding:0.5rem 0.6rem;color:var(--ink-faint);font-size:0.88rem;">見つかりませんでした</li>';
        listEl.hidden = false;
        return;
      }
      listEl.innerHTML = hits.map(function (k) {
        return '<li><button type="button" data-key="' + k + '">' + esc((D.programs[k] || {}).name || k) + '</button></li>';
      }).join('');
      listEl.hidden = false;
      listEl.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () { pick(b.getAttribute('data-key')); });
      });
    }
    searchEl.addEventListener('input', renderSuggest);
    searchEl.addEventListener('focus', renderSuggest);
    document.addEventListener('click', function (e) {
      if (!wrapEl.contains(e.target)) listEl.hidden = true;
    });
    clearBtn.addEventListener('click', clearPick);
  })();

  document.getElementById('newAppBtn').addEventListener('click', function () {
    var progEl = document.getElementById('newAppProgram');
    var programKey = progEl.value;
    if (!programKey) return;
    var name = (D.programs[programKey] || {}).name || programKey;
    var a = { id: nextId(), name: name, programKey: programKey, createdAt: seq, done: {} };
    apps.push(a);
    saveApps();
    document.getElementById('newAppProgramSearch').value = '';
    document.getElementById('newAppSearchWrap').classList.remove('has-picked');
    progEl.value = '';
    document.getElementById('newAppBtn').disabled = true;
    renderAppList();
    selectApp(a.id);
  });

  document.getElementById('appDetailProgram').addEventListener('change', function () {
    var a = findApp(currentId);
    if (!a) return;
    a.programKey = this.value;
    // 一覧の名前は常に制度名と一致させる（2026-08-15、名前欄の廃止に伴い）
    a.name = this.value ? ((D.programs[this.value] || {}).name || this.value) : '制度未選択';
    saveApps();
    renderAppList();
    renderDetail();
  });

  // documents.html から ?p=制度キー で来たとき、その制度の申請が既にあれば選ぶ、
  // 無ければ新規作成の制度欄に候補として入れておく（自動では作らない＝勝手に増えない）
  (function fromQuery() {
    var m = /[?&]p=([^&]+)/.exec(location.search);
    if (!m) return;
    var key = decodeURIComponent(m[1]);
    if (!D.programs[key]) return;
    var existing = apps.filter(function (a) { return a.programKey === key; });
    if (existing.length === 1) { selectApp(existing[0].id); return; }
    var sel = document.getElementById('newAppProgram');
    if (sel.querySelector('option[value="' + key.replace(/"/g, '') + '"]')) {
      sel.value = key;
      document.getElementById('newAppPickedName').textContent = (D.programs[key] || {}).name || key;
      document.getElementById('newAppSearchWrap').classList.add('has-picked');
      document.getElementById('newAppBtn').disabled = false;
    }
  })();

  renderAppList();
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
